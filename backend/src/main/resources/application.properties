spring.application.name=write-together

# Database (defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/writetogether}
spring.datasource.username=${DB_USERNAME:writetogether}
spring.datasource.password=${DB_PASSWORD:writetogether}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: the secret needs at least 32 characters, set JWT_SECRET in production
app.jwt.secret=${JWT_SECRET:local-development-secret-do-not-use-in-production}
app.jwt.expiration-days=7

# Where the frontend runs
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Web Push (VAPID keys). Without keys the app runs fine, it just sends no notifications.
# Generate a pair with: npx web-push generate-vapid-keys
app.push.public-key=${VAPID_PUBLIC_KEY:}
app.push.private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:admin@example.com}
