# Render Blueprint: creates the backend and the frontend in one go.
# The database runs at Neon (free, does not expire); its connection details are asked for during setup.
services:
  # Spring Boot backend, built from backend/Dockerfile
  - type: web
    name: write-together-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/push/public-key
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The free plan has 512 MB of memory; let Java use most of it, but not more.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75

  # React frontend, built once and served as plain files
  - type: web
    name: write-together
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # Every path without a real file (/books/5, /invite/ABC) gets index.html,
    # so React Router can show the right page after a refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
